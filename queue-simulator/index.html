<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queue Simulator</title>
<link rel="stylesheet" href="style.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container">
<h1>Queue Simulator (FIFO)</h1>
<div class="controls">
<input type="text" id="inputVal" placeholder="Enter value">
<button id="enqBtn">Enqueue</button>
<button id="deqBtn">Dequeue</button>
<button id="peekBtn">Peek</button>
<button id="clearBtn">Clear</button>
</div>
<p id="message"></p>
<div class="main">
<div class="queue-area">
<h3>Queue <span>FRONT -> REAR</span></h3>
<div id="queueDisplay"></div>
</div>
<div class="deleted-area">
<h3>Deleted Area</h3>
<div id="deletedDisplay"></div>
</div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
